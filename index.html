<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CalPad — Human Interface Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"]{
    --bg-surface: #F2F2F7;
    --card-surface: rgba(255, 255, 255, 0.88);
    --card-border: rgba(255, 255, 255, 0.95);
    --glass-blur: blur(24px) saturate(180%);
    --text-primary: #1C1C1E;
    --text-secondary: #6C6C70;
    --text-tertiary: #A2A2A7;
    --divider: rgba(60, 60, 67, 0.12);
    --tint: #007AFF;
    --tint-soft: rgba(0, 122, 255, 0.1);
    --accent: #34C759;
    --accent-soft: rgba(52, 199, 89, 0.12);
    --danger: #FF3B30;
    --danger-soft: rgba(255, 59, 48, 0.12);
    --control-bg: rgba(118, 118, 128, 0.12);
    --shadow-app: 0 16px 36px rgba(0,0,0,0.06);
    --shadow-floating: 0 10px 28px rgba(0,0,0,0.12);
  }

  :root[data-theme="dark"]{
    --bg-surface: #000000;
    --card-surface: rgba(28, 28, 30, 0.88);
    --card-border: rgba(255, 255, 255, 0.12);
    --glass-blur: blur(24px) saturate(200%);
    --text-primary: #F2F2F7;
    --text-secondary: #8E8E93;
    --text-tertiary: #48484A;
    --divider: rgba(84, 84, 88, 0.36);
    --tint: #0A84FF;
    --tint-soft: rgba(10, 132, 255, 0.15);
    --accent: #30D158;
    --accent-soft: rgba(48, 209, 88, 0.15);
    --danger: #FF453A;
    --danger-soft: rgba(255, 69, 58, 0.15);
    --control-bg: rgba(118, 118, 128, 0.24);
    --shadow-app: 0 20px 40px rgba(0,0,0,0.4);
    --shadow-floating: 0 14px 32px rgba(0,0,0,0.5);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  body {
    background: var(--bg-surface);
    color: var(--text-primary);
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    transition: background 0.3s ease;
  }

  body.font-sm { --scale: 0.82; }
  body.font-md { --scale: 0.92; }
  body.font-lg { --scale: 1.05; }

  .app-viewport {
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 840px;
    background: var(--card-surface);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 28px;
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-app);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 8px;
  }
  .brand { font-size: 18px; font-weight: 500; letter-spacing: -0.02em; color: var(--text-secondary); }
  .brand b { color: var(--text-primary); font-weight: 600; }
  .header-actions { display: flex; gap: 6px; }

  .apple-icon-btn {
    width: 32px; height: 32px;
    border-radius: 50%; border: none;
    background: var(--control-bg); color: var(--text-primary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 13px; font-weight: 500;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .apple-icon-btn:active { transform: scale(0.92); }
  .apple-icon-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

  .input-dock { flex-shrink: 0; padding: 2px 18px 10px; }
  .dock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .dock-label { font-size: 11px; font-weight: 400; color: var(--text-secondary); }
  .controls-cluster { display: flex; gap: 6px; align-items: center; }

  .fire-toggle {
    background: var(--control-bg); border: none; border-radius: 14px;
    padding: 3px 8px; font-size: 11px; font-weight: 500;
    color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 3px;
    transition: all 0.2s ease;
  }
  .fire-toggle.active { background: var(--danger-soft); color: var(--danger); }

  .precision-picker {
    background: var(--control-bg); color: var(--text-primary);
    border: none; border-radius: 14px; padding: 3px 7px;
    font-size: 11px; font-weight: 500; outline: none; cursor: pointer; font-family: inherit;
  }

  .formula-field {
    display: flex; align-items: center; gap: 6px;
    border-bottom: 1.5px solid var(--divider); padding-bottom: 4px;
  }
  .formula-field:focus-within { border-bottom-color: var(--tint); }
  
  #expr-input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    font-size: 19px; letter-spacing: -0.01em; color: var(--text-primary); min-width: 0;
  }

  .fx-trigger {
    border: none; background: transparent; color: var(--text-secondary);
    font-style: italic; font-family: 'SF Pro Display', serif; font-size: 16px;
    cursor: pointer; padding: 2px 4px;
  }

  .compute-btn {
    border: none; background: var(--tint); color: #FFF;
    border-radius: 50%; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.15s ease;
  }
  .compute-btn:active { transform: scale(0.9); }
  .compute-btn svg { width: 13px; height: 13px; fill: currentColor; }

  .fx-popover {
    display: none; position: absolute; top: 105px; right: 18px;
    background: var(--card-surface); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--card-border); border-radius: 14px;
    box-shadow: var(--shadow-floating); padding: 6px;
    grid-template-columns: repeat(4, 1fr); gap: 4px; z-index: 40; width: 190px;
  }
  .fx-popover.open { display: grid; }
  .fx-popover button {
    border: none; background: var(--control-bg); border-radius: 8px;
    padding: 6px 0; cursor: pointer; color: var(--text-primary);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .fx-popover button:active { transform: scale(0.94); }
  .fx-popover .sym { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; }
  .fx-popover .lbl { font-size: 8px; color: var(--text-secondary); }

  main { flex: 1; padding: 4px 18px 75px; overflow-y: auto; overflow-x: auto; position: relative; }

  .steps { display: flex; flex-direction: column; gap: 14px; }
  .step { animation: fadeRise 0.2s ease both; }
  @keyframes fadeRise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .step-header {
    font-size: calc(11.5px * var(--scale, 1)); color: var(--text-secondary);
    margin-bottom: 6px; font-style: italic; display: flex; align-items: center; gap: 4px;
  }
  .step-header b { font-style: normal; font-weight: 500; color: var(--text-secondary); }
  .step-header .hl { font-family: 'JetBrains Mono', monospace; font-style: italic; font-weight: 500; color: var(--text-primary); }

  /* Mathematical Grids with Increased Spacing */
  .division-grid, .arith-grid {
    display: inline-grid;
    row-gap: 4px;
    column-gap: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(14.5px * var(--scale, 1));
    color: var(--text-primary);
    max-width: 100%;
  }
  .division-grid > div, .arith-grid > div { display: flex; align-items: center; justify-content: center; }

  .div-divisor-cell {
    grid-column: 1 / 2;
    grid-row: 2;
    justify-content: flex-end !important;
    padding-right: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }
  .div-bracket-cell {
    grid-column: 2 / 3;
    grid-row: 2;
    justify-content: center !important;
    padding-right: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }

  /* Contextual Carry / Borrow Fields - Hidden until required */
  .a-carry-right { display: flex; align-items: center; padding-left: 8px; }
  .carry-badge-wrap {
    display: none; /* Default Hidden */
    align-items: center; gap: 3px;
    background: var(--control-bg); border-radius: 5px;
    padding: 2px 6px; font-size: 9.5px; color: var(--text-secondary);
    transition: all 0.2s ease;
  }
  .carry-badge-wrap.visible { display: flex !important; }
  .carry-badge-wrap.hidden { display: none !important; }
  .carry-badge-wrap span { font-size: 8.5px; opacity: 0.8; }
  .carry-input {
    width: 2ch; border: none; background: transparent;
    text-align: center; font-weight: 500; font-size: 11px;
    color: var(--tint); outline: none; font-family: inherit;
  }

  .row-rule { border-top: 1.2px dashed var(--divider); width: 100%; height: 0; }
  .a-final-rule { border-top: 1.5px solid var(--text-primary); width: 100%; height: 0; }

  .cell {
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(14.5px * var(--scale, 1));
    font-weight: 500; text-align: center; background: transparent;
    color: var(--tint); border: none; border-bottom: 1.5px dashed var(--divider);
    padding: 1px 2px; margin: 0; outline: none; transition: all 0.15s ease;
    min-width: 1.2ch;
  }
  .cell:focus { border-bottom-color: var(--tint); }
  
  body:not(.fire-mode) .cell.correct { border-bottom-color: transparent; color: var(--accent); }
  body:not(.fire-mode) .cell.incorrect { border-bottom-color: var(--danger); color: var(--danger); animation: jitter 0.25s ease; }
  body.fire-mode .cell { color: var(--text-primary) !important; border-bottom-color: var(--divider) !important; }

  @keyframes jitter { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-2px);} 75%{transform:translateX(2px);} }

  .answer-card { margin-top: 10px; padding: 2px 0; }
  .answer-card.hidden { display: none; }
  .answer-card .ans-info { display: flex; align-items: baseline; gap: 6px; }
  .answer-card .label { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); }
  .answer-card .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 19px; font-weight: 600; color: var(--accent);
  }
  body.fire-mode .answer-card .value { color: var(--text-primary); }

  .confetti-particle {
    position: absolute;
    width: 6px; height: 8px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 100;
    animation: confettiFall 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(120px) rotate(360deg); opacity: 0; }
  }

  .floating-dock-container {
    position: absolute; bottom: 12px; left: 0; right: 0;
    display: flex; justify-content: center; pointer-events: none; z-index: 30;
  }
  .floating-dock {
    pointer-events: auto; background: var(--card-surface);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--card-border); box-shadow: var(--shadow-floating);
    border-radius: 20px; padding: 3px 6px; display: flex; align-items: center; gap: 4px;
  }
  .dock-btn {
    border: none; background: transparent; color: var(--text-primary);
    font-size: 11.5px; font-weight: 500; padding: 5px 10px;
    border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 4px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .dock-btn:hover { background: var(--control-bg); }
  .dock-btn:active { transform: scale(0.94); }
  .dock-btn.primary { background: var(--tint); color: #FFF; }
  .dock-btn.primary:hover { opacity: 0.9; }

  .handwriting-overlay {
    display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--card-surface); backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur); border-radius: 28px;
    z-index: 60; flex-direction: column; padding: 14px;
  }
  .handwriting-overlay.open { display: flex; }

  .hw-top-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px dashed var(--divider);
  }
  .hw-question-display {
    font-family: 'JetBrains Mono', monospace; font-size: 14px;
    font-weight: 500; color: var(--text-primary);
  }

  .hw-canvas-container {
    flex: 1; border: 1px dashed var(--divider); border-radius: 14px;
    position: relative; background: var(--cell-bg); touch-action: none;
  }
  #hw-canvas { width: 100%; height: 100%; border-radius: 14px; }

  .hw-fixed-bottom-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px; gap: 6px;
  }
  .hw-action-group { display: flex; align-items: center; gap: 5px; }

  .close-icon-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: var(--control-bg); color: var(--text-secondary);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500;
  }
  .close-icon-btn:hover { background: var(--danger-soft); color: var(--danger); }

  .error-msg{
    display:none; margin:4px 18px 0; padding:6px 8px;
    background:var(--danger-soft); color:var(--danger);
    border-radius:8px; font-size:11.5px; text-align:left;
  }
  .error-msg.show{ display:block; }
</style>

<body class="font-md">

<div class="app-viewport" id="app" data-theme="light">

  <header>
    <div class="brand"><b>Cal</b>Pad</div>
    <div class="header-actions">

        <svg id="theme-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>

  <div class="input-dock">

        <div class="fx-popover" id="fx-menu">

          <button data-insert="-"><span class="sym">−</span><span class="lbl">Subtract</span></button>
          <button data-insert="*"><span class="sym">×</span><span class="lbl">Multiply</span></button>
          <button data-insert="/"><span class="sym">÷</span><span class="lbl">Divide</span></button>
          <button data-insert="()"><span class="sym">( )</span><span class="lbl">Brackets</span></button>
          <button data-insert="²"><span class="sym">x²</span><span class="lbl">Square</span></button>
          <button data-insert="√"><span class="sym">√</span><span class="lbl">Sq Root</span></button>

<!-- Audio Feedback Engine -->
<script>
class SoundEngine {
  constructor() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  playClick() {
    if(this.ctx.state === 'suspended') this.ctx.resume();
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.03);
    gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.03);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.03);
  }
  playSuccess() {
    if(this.ctx.state === 'suspended') this.ctx.resume();
    const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.05); osc.frequency.setValueAtTime(783.99, now + 0.1);
    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(now + 0.35);
  }
  playError() {
    if(this.ctx.state === 'suspended') this.ctx.resume();
    const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now); osc.frequency.setValueAtTime(140, now + 0.05);
    gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(now + 0.18);
  }
}
const audioFX = new SoundEngine();
</script>

<script>
(function(){

const precisionSelect = document.getElementById('precision-select');
const fireBtn = document.getElementById('fire-btn');
let currentPrecision = precisionSelect.value;
let isFireMode = false;

fireBtn.addEventListener('click', () => {
  audioFX.playClick();
  isFireMode = !isFireMode;
  fireBtn.classList.toggle('active', isFireMode);
  document.body.classList.toggle('fire-mode', isFireMode);
  setupPracticeInputs(); // Reconfigure edit freedom
});

precisionSelect.addEventListener('change', () => {
  audioFX.playClick();
  currentPrecision = precisionSelect.value;
  solve(input.value.trim());
});

const app = document.getElementById('app');
const themeBtn = document.getElementById('theme-btn');
const themeIcon = document.getElementById('theme-icon');
const fontBtn = document.getElementById('font-btn');

const SUN = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>';
const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>';

let theme = 'light';
themeBtn.addEventListener('click', () => {
  audioFX.playClick();
  theme = theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  app.setAttribute('data-theme', theme);
  themeIcon.innerHTML = theme === 'light' ? SUN : MOON;
});

const fontSizes = ['font-sm','font-md','font-lg'];
let fontIdx = 1;
fontBtn.addEventListener('click', () => {
  audioFX.playClick();
  document.body.classList.remove(fontSizes[fontIdx]);
  fontIdx = (fontIdx + 1) % fontSizes.length;
  document.body.classList.add(fontSizes[fontIdx]);
});

const fxBtn = document.getElementById('fx-btn');
const fxMenu = document.getElementById('fx-menu');

fxBtn.addEventListener('click', (e) => {
  e.stopPropagation(); audioFX.playClick(); fxMenu.classList.toggle('open');
});
document.addEventListener('click', () => fxMenu.classList.remove('open'));
fxMenu.querySelectorAll('button[data-insert]').forEach(btn => {
  btn.addEventListener('click', () => {
    audioFX.playClick(); insertSymbol(btn.dataset.insert); fxMenu.classList.remove('open');
  });
});

function insertSymbol(text){
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0, start) + text + input.value.slice(end);
  input.focus(); solve(input.value.trim());
}

function decimalsOf(str){ const i = str.indexOf('.'); return i === -1 ? 0 : str.length - i - 1; }
function formatNum(n){
  if (!isFinite(n)) return 'undefined';
  let r = Math.round((n + Number.EPSILON) * 1e6) / 1e6;
  return Object.is(r, -0) ? '0' : String(r);
}
function padDecimals(str, places){
  let neg = str.startsWith('-'); if(neg) str = str.slice(1);
  let [i, f=''] = str.split('.');
  while(f.length < places) f += '0';
  return (neg?'-':'') + i + (places>0 ? '.'+f : '');
}
function escapeHtml(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function tokenize(expr){
  expr = expr.replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/x²/gi,'²');
  const tokens = []; let i = 0;
  while(i < expr.length){
    const ch = expr[i];
    if('()²√%^'.includes(ch)){ tokens.push(ch); i++; continue; }
    if('+-*/'.includes(ch)){
      const prev = tokens[tokens.length-1];
      const isUnary = (ch==='-' || ch==='+') && (prev===undefined || prev==='(' || '+-*/^'.includes(prev));
      if(isUnary){
        let j = i+1, num = ch==='-' ? '-' : '';
        while(j<expr.length && /[0-9.]/.test(expr[j])){ num += expr[j]; j++; }
        tokens.push(num); i = j; continue;
      }
      tokens.push(ch); i++; continue;
    }
    if(/[0-9.]/.test(ch)){
      let j=i, num='';
      while(j<expr.length && /[0-9.]/.test(expr[j])){ num+=expr[j]; j++; }
      tokens.push(num); i=j; continue;
    }
    throw new Error('Unrecognized symbol');
  }
  return tokens;
}

function checkNeedsCarryAddSub(a, b, op){
  let carryNeeded = false;
  let aDigits = a.replace('.','').split('').reverse();
  let bDigits = b.replace('.','').split('').reverse();
  let len = Math.max(aDigits.length, bDigits.length);
  let carry = 0;
  for(let i=0; i<len; i++){
    let d1 = parseInt(aDigits[i]||'0', 10);
    let d2 = parseInt(bDigits[i]||'0', 10);
    if(op==='+'){
      if(d1 + d2 + carry >= 10) { carryNeeded = true; break; }
      carry = Math.floor((d1+d2+carry)/10);
    } else {
      if(d1 - carry < d2) { carryNeeded = true; break; }
      carry = (d1 - carry < d2) ? 1 : 0;
    }
  }
  return carryNeeded;
}

function checkNeedsMultiplyCarry(aStr, dVal) {
  let digits = aStr.replace('.','').split('').reverse();
  let carry = 0;
  for (let i = 0; i < digits.length; i++) {
    let prod = parseInt(digits[i], 10) * dVal + carry;
    if (prod >= 10) return true;
    carry = Math.floor(prod / 10);
  }
  return false;
}

function buildAddSubModel(aStr, bStr, op, resultStr){
  const dec = Math.max(decimalsOf(aStr), decimalsOf(bStr));
  const a = padDecimals(aStr, dec);
  const b = padDecimals(bStr, dec);
  const r = padDecimals(resultStr, dec);
  const width = Math.max(a.length, b.length, r.length);
  const hasCarry = checkNeedsCarryAddSub(a, b, op);

  const rows = [
    { kind:'given', text:a },
    { kind:'given', text:b, sym: op==='+'?'+':'\u2212' },
    { kind:'final-rule' },
    { kind:'blank', text:r, hasCarry: hasCarry, carryLabel: op==='+'?'carry':'borrow' }
  ];
  return { resultStr: r, isGrid:true, grid:{ width, prefixCols:1, rows } };
}

function buildMultiplyModel(aStr, bStr, resultStr){
  const intA = aStr.replace('.','').replace(/^0+(?=\d)/,'') || '0';
  const intB = bStr.replace('.','').replace(/^0+(?=\d)/,'') || '0';
  
  const bDigits = intB.split('').reverse();
  const partials = [];
  
  if (bDigits.length > 1) {
    bDigits.forEach((d, idx) => {
      const val = (BigInt(intA) * BigInt(d) * (10n ** BigInt(idx))).toString();
      partials.push(val);
    });
  }

  const width = Math.max(intA.length, intB.length, resultStr.length, ...partials.map(p => p.length));

  const rows = [
    { kind:'given', text:intA },
    { kind:'given', text:intB, sym:'\u00D7' },
    { kind:'final-rule' }
  ];

  if (partials.length > 1) {
    partials.forEach((p, pIdx) => {
      rows.push({ kind:'blank', text:p, hasCarry: true, carryLabel:'carry' });
    });
    rows.push({ kind:'final-rule' });
  }

  rows.push({ kind:'blank', text:resultStr, hasCarry: partials.length <= 1, carryLabel:'carry' });

  return { resultStr, isGrid:true, grid:{ width, prefixCols:1, rows } };
}

function buildDivisionModel(aStr, bStr){
  let [bInt, bFrac=''] = bStr.split('.');
  const shift = bFrac.length;
  const divisorStr = (bInt + bFrac).replace(/^0+(?=\d)/,'') || '0';
  const divisor = parseInt(divisorStr, 10);
  if(divisor === 0) throw new Error('Cannot divide by zero');

  let [aInt, aFrac=''] = aStr.split('.');
  let combined = aInt + aFrac;
  const dotPos = aInt.length;
  let newDotPos = dotPos + shift;
  while(combined.length < newDotPos) combined += '0';
  let newAInt = combined.slice(0, newDotPos).replace(/^0+(?=\d)/,'') || '0';
  let newAFrac = combined.slice(newDotPos);

  const L = newAInt.length;
  const intDigits = newAInt.split('');
  const steps = [];
  let current = 0;
  let leading = false;
  const quotientIntDigits = [];

  for(let k=0; k<intDigits.length; k++){
    current = current*10 + Number(intDigits[k]);
    if (!leading && current < divisor) {
      if (k === intDigits.length - 1 && quotientIntDigits.length === 0) {
        quotientIntDigits.push(0);
        steps.push({ qd: 0, preValue: current, product: 0, remainder: current, endCol: k });
      }
      continue;
    }
    leading = true;
    const qd = Math.floor(current/divisor);
    current = current - qd*divisor;
    quotientIntDigits.push(qd);
    steps.push({ qd, preValue: current + qd*divisor, product: qd*divisor, remainder: current, endCol: k });
  }

  const quotientDecDigits = [];
  const maxDecimals = currentPrecision === 'whole' ? 0 : parseInt(currentPrecision, 10);
  
  if(maxDecimals > 0 && current !== 0){
    let bringDown = newAFrac.split('');
    let count = 0;
    while(current !== 0 && count < maxDecimals){
      const digit = bringDown.length ? bringDown.shift() : '0';
      current = current*10 + Number(digit);
      const preValue = current;
      const qd = Math.floor(current/divisor);
      current = current - qd*divisor;
      quotientDecDigits.push(qd);
      steps.push({ qd, preValue, product: qd*divisor, remainder: current, endCol: L + 1 + count });
      count++;
    }
  }

  let quotientStr = quotientIntDigits.join('');
  if (maxDecimals > 0 && quotientDecDigits.length > 0) {
    quotientStr += '.' + quotientDecDigits.join('');
  }

  const resultNum = parseFloat(quotientStr);
  let displayResult = formatNum(resultNum);
  if (currentPrecision === 'whole' && current !== 0) displayResult += ` R ${current}`;

  const showDecimalsInGrid = maxDecimals > 0;
  let dividendFullStr = newAInt;
  if(showDecimalsInGrid && (newAFrac || quotientDecDigits.length > 0)){
    let fracPart = newAFrac;
    while(fracPart.length < quotientDecDigits.length) fracPart += '0';
    dividendFullStr += '.' + fracPart;
  }

  const dividendChars = [];
  const colMap = [];
  for(let i=0; i<dividendFullStr.length; i++){
    const ch = dividendFullStr[i];
    dividendChars.push({ col: i, char: ch });
    colMap.push(i);
  }

  const quotientCells = [];
  quotientIntDigits.forEach((d, k) => {
    let targetCol = steps[k] ? steps[k].endCol : (L - quotientIntDigits.length + k);
    quotientCells.push({ col: targetCol, kind: 'blank', expected: String(d), group: k });
  });

  if(showDecimalsInGrid && quotientDecDigits.length > 0){
    quotientCells.push({ col: L, kind: 'text', text: '.' });
    quotientDecDigits.forEach((d, j) => {
      quotientCells.push({ col: L + 1 + j, kind: 'blank', expected: String(d), group: quotientIntDigits.length + j });
    });
  }

  const gridRows = [];
  steps.forEach((s, i) => {
    let endCharIdx = s.endCol;
    if(showDecimalsInGrid && s.endCol >= L) endCharIdx = s.endCol;

    if(i > 0) gridRows.push({ kind:'bringdown', endCharIdx, expected: String(s.preValue), group: i });
    const needsBorrow = checkNeedsCarryAddSub(String(s.preValue), String(s.product), '-');
    const needsMultiplyCarry = checkNeedsMultiplyCarry(String(divisor), s.qd);

    gridRows.push({
      kind:'subtract',
      endCharIdx,
      expected: String(s.product),
      group: i,
      hasCarry: needsBorrow || needsMultiplyCarry,
      carryLabel: needsMultiplyCarry ? 'carry' : 'borrow'
    });
    gridRows.push({ kind:'rule', endCharIdx, len: String(s.product).length, group: i });
    if(i === steps.length - 1) gridRows.push({ kind:'remainder', endCharIdx, expected: String(s.remainder), group: i });
  });

  return {
    resultStr: displayResult,
    isDivision: true,
    grid: { totalCols: 2 + dividendChars.length, prefixCols: 2, displayDivisor: String(divisor), dividendChars, quotientCells, rows: gridRows, colMap }
  };
}

function reduce(tokens){
  const steps = []; let guard = 0;
  while(tokens.length > 1 && guard++ < 30){
    let opIdx = -1;
    for(let i=0; i<tokens.length; i++){ if('*/+-'.includes(tokens[i])) { opIdx = i; break; } }
    if(opIdx === -1) break;

    const left = tokens[opIdx-1], op = tokens[opIdx], right = tokens[opIdx+1];
    let model, res;

    if(op === '/') {
      model = buildDivisionModel(left, right);
      res = model.resultStr.split(' ')[0];
    } else if(op === '*') {
      res = formatNum(parseFloat(left)*parseFloat(right));
      model = buildMultiplyModel(left, right, res);
    } else if(op === '+') {
      res = formatNum(parseFloat(left)+parseFloat(right));
      model = buildAddSubModel(left, right, '+', res);
    } else {
      res = formatNum(parseFloat(left)-parseFloat(right));
      model = buildAddSubModel(left, right, '-', res);
    }

    steps.push({ opName: op==='/'?'Divide':op==='*'?'Multiply':op==='+'?'Add':'Subtract', exprHtml: `${left} ${op==='*'?'×':op==='/'?'÷':op} ${right}`, model });
    tokens.splice(opIdx-1, 3, res);
  }
  return { steps, finalResult: tokens[0] };
}

const content = document.getElementById('content');
const errorMsg = document.getElementById('error-msg');
const input = document.getElementById('expr-input');
const solutionBtn = document.getElementById('solution-btn');
const goBtn = document.getElementById('go-btn');
const hwQuestionText = document.getElementById('hw-question-text');

let currentSteps = null, currentFinal = null, revealTimer = null;

solutionBtn.addEventListener('click', () => {
  audioFX.playClick();
  if (solutionBtn.textContent === 'Close') hideAllCells();
  else revealStepByStep();
});

goBtn.addEventListener('click', () => { audioFX.playClick(); solve(input.value.trim()); });

function tokenToHtml(tok, registry, stepIdx, orderState){
  if (tok.kind === 'text') return escapeHtml(tok.text);
  const idx = registry.length;
  const expected = tok.expected;
  registry.push({ expected, stepIdx });
  const order = orderState.n++;
  return `<input type="text" class="cell" data-order="${order}" data-step="${stepIdx}" data-answer="${escapeHtml(expected)}" maxlength="${expected.length}" style="width:${Math.max(expected.length,1)}ch">`;
}

function renderDivisionGrid(model, registry, stepIdx, orderState){
  const g = model.grid;
  let html = `<div class="division-grid" style="grid-template-columns: auto auto repeat(${g.dividendChars.length}, 1ch) auto;">`;

  g.quotientCells.forEach((c) => {
    const s = 3 + c.col;
    html += `<div style="grid-column:${s}/${s+1}; grid-row:1;">${tokenToHtml(c, registry, stepIdx, orderState)}</div>`;
  });

  html += `<div class="div-divisor-cell">${escapeHtml(g.displayDivisor)}</div>`;
  html += `<div class="div-bracket-cell">)</div>`;
  
  g.dividendChars.forEach(c => {
    const s = 3 + c.col;
    html += `<div style="grid-column:${s}/${s+1}; grid-row:2; border-top:1.2px solid var(--text-primary);">${escapeHtml(c.char)}</div>`;
  });

  let rowNum = 3;
  g.rows.forEach((r, rIdx) => {
    if (r.kind === 'rule') {
      const endCol = 3 + r.endCharIdx + 1;
      const startCol = Math.max(3, endCol - r.len);
      html += `<div class="row-rule" style="grid-column:${startCol}/${endCol}; grid-row:${rowNum};"></div>`;
    } else {
      const digits = r.expected ? r.expected.split('') : [];
      digits.forEach((d, di) => {
        const s = 3 + (r.endCharIdx - digits.length + 1 + di);
        html += `<div style="grid-column:${s}/${s+1}; grid-row:${rowNum};">${tokenToHtml({expected:d}, registry, stepIdx, orderState)}</div>`;
      });
      if (r.hasCarry) {
        const fullCols = 3 + g.dividendChars.length;
        html += `<div class="a-carry-right" style="grid-column:${fullCols}/${fullCols+1}; grid-row:${rowNum};">
          <div class="carry-badge-wrap" data-step-carry="${stepIdx}-${rIdx}"><span>${r.carryLabel}</span><input type="text" class="carry-input" maxlength="2"></div>
        </div>`;
      }
    }
    rowNum++;
  });
  html += '</div>';
  return html;
}

function renderColumnGrid(g, registry, stepIdx, orderState){
  const prefixCols = g.prefixCols || 1;
  const totalCols = prefixCols + g.width;
  let html = `<div class="arith-grid" style="grid-template-columns:repeat(${totalCols}, 1ch) auto;">`;
  let rowNum = 1;

  g.rows.forEach((r, rIdx) => {
    if(r.kind === 'final-rule'){
      html += `<div class="a-final-rule" style="grid-column:1 / ${totalCols+2}; grid-row:${rowNum};"></div>`;
      rowNum++; return;
    }

    const padded = ' '.repeat(Math.max(0, g.width - r.text.length)) + r.text;
    if(r.sym){
      html += `<div style="grid-column:1 / ${prefixCols+1}; grid-row:${rowNum}; justify-content:flex-start;">${escapeHtml(r.sym)}</div>`;
    }

    for(let c=0; c<padded.length; c++){
      const ch = padded[c];
      if(ch === ' ') continue;
      const col = prefixCols + c + 1;
      const style = `grid-column:${col} / ${col+1}; grid-row:${rowNum};`;
      if(r.kind === 'given'){
        html += `<div style="${style}">${escapeHtml(ch)}</div>`;
      } else {
        html += `<div style="${style}">${tokenToHtml({expected:ch}, registry, stepIdx, orderState)}</div>`;
      }
    }

    if (r.hasCarry) {
      html += `<div class="a-carry-right" style="grid-column:${totalCols+1} / ${totalCols+2}; grid-row:${rowNum};">
        <div class="carry-badge-wrap" data-step-carry="${stepIdx}-${rIdx}"><span>${r.carryLabel || 'carry'}</span><input type="text" class="carry-input" maxlength="2"></div>
      </div>`;
    }
    rowNum++;
  });
  html += '</div>';
  return html;
}

function renderSteps(){
  const registry = [];
  const orderState = { n: 0 };
  if (revealTimer) clearInterval(revealTimer);
  solutionBtn.textContent = 'Reveal';

  let html = '<div class="steps">';
  currentSteps.forEach((s, idx) => {
    html += `<div class="step" data-step-index="${idx}"><div class="step-header">Step ${idx+1}: <b>${s.opName}</b> &nbsp;<span class="hl">${s.exprHtml}</span></div>`;
    html += s.model.isDivision
      ? renderDivisionGrid(s.model, registry, idx, orderState)
      : renderColumnGrid(s.model.grid, registry, idx, orderState);
    html += `</div>`;
  });
  
  html += `<div class="answer-card hidden" id="answer-card">
      <div class="ans-info"><span class="label">Answer =</span><span class="value">${escapeHtml(currentFinal)}</span></div>
    </div>`;
  html += `</div>`;
  content.innerHTML = html;

  setupPracticeInputs();
}

function setupPracticeInputs(){
  const inputs = Array.from(content.querySelectorAll('.cell')).sort((a,b) => Number(a.dataset.order) - Number(b.dataset.order));
  
  inputs.forEach((el, i) => {
    // In normal mode, restrict locking. In Fire Mode, give absolute edit freedom.
    if (!isFireMode && i > 0 && !inputs[i-1].classList.contains('correct')) {
      el.disabled = true;
    } else {
      el.disabled = false;
    }

    el.addEventListener('focus', () => {
      // Reveal associated carry badge when input comes into calculation focus
      const parentRow = el.closest('div');
      const stepWrap = el.closest('.step');
      if (stepWrap) {
        const carryBadge = stepWrap.querySelector('.carry-badge-wrap');
        if (carryBadge && !carryBadge.classList.contains('hidden')) {
          carryBadge.classList.add('visible');
        }
      }
    });

    el.addEventListener('input', () => handleCellInput(el, inputs));
  });

  if (inputs.length && !isFireMode) {
    const firstActive = inputs.find(inp => !inp.disabled) || inputs[0];
    firstActive.focus();
  }
}

function handleCellInput(el, inputs){
  let val = el.value.trim();
  if(val.length < parseInt(el.maxLength, 10)) return;

  if(val === el.dataset.answer || isFireMode){
    if(!isFireMode) { el.classList.add('correct'); audioFX.playClick(); }
    el.disabled = !isFireMode; // Keep active in Exam/Fire mode

    // Hide carry badge once row calculation finishes
    const stepWrap = el.closest('.step');
    if(stepWrap) {
      const activeBadges = stepWrap.querySelectorAll('.carry-badge-wrap');
      activeBadges.forEach(b => {
        b.classList.remove('visible');
        b.classList.add('hidden');
      });
    }

    // Mathematical process-based automatic focus transition
    const currentIndex = inputs.indexOf(el);
    const nextInput = inputs[currentIndex + 1];

    if (nextInput) {
      nextInput.disabled = false;
      nextInput.focus();
    } else {
      onAllComplete();
    }
  } else {
    audioFX.playError();
    el.classList.add('incorrect');
    setTimeout(() => { el.value=''; el.classList.remove('incorrect'); }, 400);
  }
}

function revealStepByStep(){
  const cells = Array.from(content.querySelectorAll('.cell')).sort((a,b) => Number(a.dataset.order) - Number(b.dataset.order));
  if (revealTimer) clearInterval(revealTimer);
  solutionBtn.textContent = 'Close';

  let idx = 0;
  revealTimer = setInterval(() => {
    while(idx < cells.length && (cells[idx].disabled && cells[idx].classList.contains('correct'))) idx++;
    if(idx < cells.length) {
      const el = cells[idx];
      el.value = el.dataset.answer;
      if(!isFireMode) el.classList.add('correct');
      el.disabled = !isFireMode;
      
      const stepWrap = el.closest('.step');
      if(stepWrap) {
        stepWrap.querySelectorAll('.carry-badge-wrap').forEach(b => {
          b.classList.remove('visible');
          b.classList.add('hidden');
        });
      }
      audioFX.playClick();
      idx++;
    } else {
      clearInterval(revealTimer);
      onAllComplete();
    }
  }, 100);
}

function hideAllCells(){
  if (revealTimer) clearInterval(revealTimer);
  content.querySelectorAll('.cell').forEach(el => { el.value = ''; el.classList.remove('correct','incorrect'); el.disabled = false; });
  content.querySelectorAll('.carry-badge-wrap').forEach(b => {
    b.classList.remove('visible');
    b.classList.remove('hidden');
  });
  document.getElementById('answer-card').classList.add('hidden');
  solutionBtn.textContent = 'Reveal';
  setupPracticeInputs();
}

function triggerConfetti(){
  if(isFireMode) return;
  const container = document.getElementById('main-area');
  const colors = ['#007AFF', '#34C759', '#FF9500', '#AF52DE', '#FF2D55'];
  
  for(let i = 0; i < 24; i++){
    const p = document.createElement('div');
    p.className = 'confetti-particle';
    p.style.left = (15 + Math.random() * 70) + '%';
    p.style.top = '20px';
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random() * 0.2) + 's';
    container.appendChild(p);
    setTimeout(() => p.remove(), 1300);
  }
}

function onAllComplete(){
  document.getElementById('answer-card').classList.remove('hidden');
  audioFX.playSuccess();
  triggerConfetti();
}

function solve(expr){
  errorMsg.classList.remove('show');
  try{
    const tokens = tokenize(expr);
    const r = reduce(tokens);
    currentSteps = r.steps; currentFinal = r.finalResult;
    hwQuestionText.textContent = input.value.replace(/\//g, ' ÷ ').replace(/\*/g, ' × ');
    renderSteps();
  } catch(e) {
    errorMsg.textContent = e.message;
    errorMsg.classList.add('show');
  }
}

const hwOverlay = document.getElementById('hw-overlay');
const hwCanvas = document.getElementById('hw-canvas');
let ctx = hwCanvas.getContext('2d'), drawing = false;

document.getElementById('practice-btn').addEventListener('click', () => { audioFX.playClick(); hwOverlay.classList.add('open'); resizeCanvas(); });
document.getElementById('hw-close-btn').addEventListener('click', () => { audioFX.playClick(); hwOverlay.classList.remove('open'); });
document.getElementById('hw-clear-btn').addEventListener('click', () => { audioFX.playClick(); ctx.clearRect(0,0,hwCanvas.width,hwCanvas.height); });

function resizeCanvas(){
  const rect = document.getElementById('hw-canvas-container').getBoundingClientRect();
  hwCanvas.width = rect.width; hwCanvas.height = rect.height;
  ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--text-primary');
}

hwCanvas.addEventListener('pointerdown', (e) => { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
hwCanvas.addEventListener('pointermove', (e) => { if(!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
hwCanvas.addEventListener('pointerup', () => drawing = false);
function getPos(e){ const rect = hwCanvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }

solve(input.value.trim());

})();
</script>
